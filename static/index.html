<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HerFitness — Demo</title>
  </head>
  <body>
    <h1>HerFitness — Generate Plan (Demo)</h1>
    <form id="profile">
      <label>Age: <input name="age" value="25"/></label><br/>
      <label>Height (cm): <input name="height_cm" value="165"/></label><br/>
      <label>Weight (kg): <input name="weight_kg" value="70"/></label><br/>
      <label>Goal: <input name="goal" value="fat loss"/></label><br/>
      <label>Workout days/week: <input name="workout_days" value="4"/></label><br/>
      <button type="submit">Generate Plan</button>
    </form>

    <pre id="out"></pre>

    <script>
      const form = document.getElementById('profile');
      const out = document.getElementById('out');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        const body = {
          age: Number(fd.get('age')),
          height_cm: Number(fd.get('height_cm')),
          weight_kg: Number(fd.get('weight_kg')),
          goal: fd.get('goal'),
          workout_days: Number(fd.get('workout_days'))
        };

        out.textContent = 'Generating...';
        const res = await fetch('/generate_plan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const json = await res.json();
        out.textContent = JSON.stringify(json, null, 2);
      });
    </script>
  </body>
</html>
